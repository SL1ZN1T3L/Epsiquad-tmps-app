name: tmps
description: Временные файловые хранилища Epsiquad - клиент для Android
publish_to: "none"
version: 1.4.1+20260929

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  background_downloader: ^9.6.3
  web_socket_channel: ^3.0.3
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  local_auth: ^3.0.2
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  crypto: ^3.0.6
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  min_sdk_android: 26
  image_path: "assets/icon/app-icon.png"
  adaptive_icon_background: "assets/icon/icon-bg.png"
  adaptive_icon_foreground: "assets/icon/icon-fg.png"
