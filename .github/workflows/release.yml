name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Восстановить keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tmps-upload.p12
          cat > android/key.properties <<EOF
          storeFile=tmps-upload.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test
        continue-on-error: true

      - name: Сборка APK
        run: flutter build apk --release --split-per-abi -Pforce-version-code-ignoring-abi=true

      - name: Сборка универсального APK
        run: flutter build apk --release

      - name: Контрольные суммы
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Текст релиза
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/$REPO/releases/download/$TAG"
          B="https://img.shields.io/badge"
          S="logo=android&logoColor=3DDC84&labelColor=2b3038"
          {
            echo "## Скачать"
            echo
            echo "| Устройство | Файл |"
            echo "| --- | --- |"
            echo "| Большинство телефонов с 2016 года | [![arm64-v8a]($B/APK-arm64--v8a-40916c?$S)]($BASE/app-arm64-v8a-release.apk) |"
            echo "| Старые и бюджетные, 32 бита | [![armeabi-v7a]($B/APK-armeabi--v7a-40916c?$S)]($BASE/app-armeabi-v7a-release.apk) |"
            echo "| Эмуляторы и планшеты на Intel | [![x86_64]($B/APK-x86__64-40916c?$S)]($BASE/app-x86_64-release.apk) |"
            echo "| Не знаете какой - берите этот | [![universal]($B/APK-universal-40916c?$S)]($BASE/app-release.apk) |"
            echo
            echo "Универсальный весит больше, потому что содержит код под все архитектуры сразу. Работает везде."
            echo
            echo "### При установке Android покажет предупреждение"
            echo
            echo "Приложение распространяется не через Google Play, поэтому система предупредит об установке из неизвестного источника, а Play Защита сообщит, что не проверяла это приложение. Это ожидаемо. Нажмите «Подробнее», затем «Всё равно установить»."
          } > notes.md
          cat notes.md

      - name: Убрать секреты
        if: always()
        run: rm -f android/app/tmps-upload.p12 android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
          generate_release_notes: true
